[project]
name = "inbrief-embedder"
version = "0.1.0"
description = "InBrief embedder service"
authors = [
    { name = "Nikita Rydanov", email = "find.art.in.living@gmail.com" }
]
dependencies = [
    "pydantic>=2.10.3",
    "asgi-correlation-id>=4.3.1",
    "pydantic-settings>=2.2.1",
    "uvicorn>=0.29.0",
    "databases[asyncpg]>=0.9.0",
    "shared",
    "transformers>=4.47.1",
    "faststream[cli,kafka]>=0.5.33",
    "rb-tocase>=1.3.2",
    "redis>=5.2.1",
    "torch>=2.5.1",
    "einops>=0.8.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
dev-dependencies = [
    "ruff>=0.3.5",
    "ipython>=8.24.0",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [
    "**/__pycache__",
    "./.venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true

[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = false

[tool.vulture]
ignore_decorators = ["@app.*", "@require_*"]
min_confidence = 60
sort_by_size = true
